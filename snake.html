<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Tiny Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* Game-specific variables */
        :root {
            --snake-head: #1a1a1a;
            --snake-body: #4a4a4a;
            --food: #d4908a;
            --food-glow: rgba(212, 144, 138, 0.3);
        }

        /* Speed buttons - smaller */
        .speed-buttons {
            display: flex;
            gap: 0.25rem;
        }

        .speed-btn {
            font-size: 0.5rem;
            padding: 0.375rem 0.5rem;
            flex: 1;
        }

        /* Length display */
        .overlay-length {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <!-- Navigation Header -->
    <nav class="nav-header">
        <a href="index.html" class="nav-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </a>
        <span class="nav-title">Snake</span>
    </nav>

    <div class="start-overlay" id="start-overlay">
        <h1 class="start-title">Snake</h1>
        <p class="start-hint">Use arrow keys or WASD to move</p>
        <button class="start-btn" id="start-btn">Press to Start</button>
    </div>

    <div class="container">
        <div class="game-wrapper">
            <div class="header">
                <span class="title">Snake</span>
                <span class="score-inline" id="score-inline">0</span>
            </div>
            <div class="board-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-section">
                <span class="panel-label">Score</span>
                <div class="score-display">
                    <div class="score-item">
                        <span class="score-label">Current</span>
                        <span class="score-value" id="score">0</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">Best</span>
                        <span class="best-value" id="best">0</span>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <span class="panel-label">Length</span>
                <span class="score-value" id="length">3</span>
            </div>

            <div class="panel-section">
                <span class="panel-label">Speed</span>
                <div class="speed-buttons">
                    <button class="speed-btn" data-speed="slow">Slow</button>
                    <button class="speed-btn active" data-speed="normal">Med</button>
                    <button class="speed-btn" data-speed="fast">Fast</button>
                </div>
            </div>

            <div class="panel-section">
                <button class="new-game-btn" id="new-game">New Game</button>
            </div>

            <div class="panel-section">
                <span class="panel-label">Controls</span>
                <p class="hint">
                    <strong>↑↓←→</strong> or <strong>WASD</strong><br>
                    Eat food to grow<br>
                    Don't hit walls or yourself
                </p>
            </div>
        </div>
    </div>

    <div class="overlay" id="game-over">
        <div class="overlay-content">
            <p class="overlay-title">Game Over</p>
            <p class="overlay-score" id="final-score">0</p>
            <p class="overlay-length">Length: <span id="final-length">3</span></p>
            <button class="restart-btn" id="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // ============================================
        // GAME CONSTANTS
        // ============================================
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = GRID_SIZE * CELL_SIZE;
        canvas.height = GRID_SIZE * CELL_SIZE;

        const SPEEDS = {
            slow: 150,
            normal: 100,
            fast: 60
        };

        // ============================================
        // GAME STATE
        // ============================================
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snake-best') || '0');
        let gameOver = false;
        let gameStarted = false;
        let speed = 'normal';
        let gameInterval = null;
        let foodPulse = 0;

        // ============================================
        // GAME LOGIC
        // ============================================
        function initGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            gameOver = false;

            placeFood();
            updateDisplay();
        }

        function placeFood() {
            let validPosition = false;

            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);

                validPosition = !snake.some(seg => seg.x === food.x && seg.y === food.y);
            }
        }

        function update() {
            if (gameOver) return;

            direction = { ...nextDirection };

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                die();
                return;
            }

            // Check self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                die();
                return;
            }

            snake.unshift(head);
            audio.playMove();

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                audio.playSuccess();

                const rect = canvas.getBoundingClientRect();
                if (particles) {
                    particles.addBurst(
                        rect.left + food.x * CELL_SIZE + CELL_SIZE / 2,
                        rect.top + food.y * CELL_SIZE + CELL_SIZE / 2,
                        10,
                        '#d4908a'
                    );
                }

                placeFood();
                updateDisplay();
            } else {
                snake.pop();
            }

            draw();
        }

        function die() {
            gameOver = true;
            clearInterval(gameInterval);
            audio.playError();

            // Convert snake positions to screen coordinates
            const rect = canvas.getBoundingClientRect();
            if (particles) {
                snake.forEach((seg, i) => {
                    setTimeout(() => {
                        particles.addBurst(
                            rect.left + seg.x * CELL_SIZE + CELL_SIZE / 2,
                            rect.top + seg.y * CELL_SIZE + CELL_SIZE / 2,
                            4,
                            i === 0 ? '#1a1a1a' : '#4a4a4a'
                        );
                    }, i * 30);
                });
            }

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snake-best', bestScore);
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('final-length').textContent = snake.length;

            setTimeout(() => {
                document.getElementById('game-over').classList.add('visible');
            }, 500);

            updateDisplay();
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            // Clear
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.03)';
            ctx.lineWidth = 1;

            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw food with pulse effect
            foodPulse += 0.1;
            const pulse = 1 + Math.sin(foodPulse) * 0.1;

            // Food glow
            const gradient = ctx.createRadialGradient(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                0,
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE * 1.5
            );
            gradient.addColorStop(0, 'rgba(212, 144, 138, 0.3)');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(
                food.x * CELL_SIZE - CELL_SIZE,
                food.y * CELL_SIZE - CELL_SIZE,
                CELL_SIZE * 3,
                CELL_SIZE * 3
            );

            // Food
            ctx.fillStyle = '#d4908a';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                (CELL_SIZE / 2 - 2) * pulse,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw snake
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const padding = 2;
                const radius = 4;

                // Color gradient from head to tail
                const t = index / snake.length;
                const r = Math.round(26 + t * 48);
                const g = Math.round(26 + t * 48);
                const b = Math.round(26 + t * 48);
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;

                // Rounded rectangle
                ctx.beginPath();
                ctx.moveTo(x + padding + radius, y + padding);
                ctx.lineTo(x + CELL_SIZE - padding - radius, y + padding);
                ctx.quadraticCurveTo(x + CELL_SIZE - padding, y + padding, x + CELL_SIZE - padding, y + padding + radius);
                ctx.lineTo(x + CELL_SIZE - padding, y + CELL_SIZE - padding - radius);
                ctx.quadraticCurveTo(x + CELL_SIZE - padding, y + CELL_SIZE - padding, x + CELL_SIZE - padding - radius, y + CELL_SIZE - padding);
                ctx.lineTo(x + padding + radius, y + CELL_SIZE - padding);
                ctx.quadraticCurveTo(x + padding, y + CELL_SIZE - padding, x + padding, y + CELL_SIZE - padding - radius);
                ctx.lineTo(x + padding, y + padding + radius);
                ctx.quadraticCurveTo(x + padding, y + padding, x + padding + radius, y + padding);
                ctx.closePath();
                ctx.fill();

                // Eyes on head
                if (index === 0) {
                    ctx.fillStyle = '#ffffff';
                    const eyeSize = 3;

                    let eye1x, eye1y, eye2x, eye2y;

                    if (direction.x === 1) {
                        eye1x = x + CELL_SIZE - 6;
                        eye1y = y + 6;
                        eye2x = x + CELL_SIZE - 6;
                        eye2y = y + CELL_SIZE - 6;
                    } else if (direction.x === -1) {
                        eye1x = x + 6;
                        eye1y = y + 6;
                        eye2x = x + 6;
                        eye2y = y + CELL_SIZE - 6;
                    } else if (direction.y === 1) {
                        eye1x = x + 6;
                        eye1y = y + CELL_SIZE - 6;
                        eye2x = x + CELL_SIZE - 6;
                        eye2y = y + CELL_SIZE - 6;
                    } else {
                        eye1x = x + 6;
                        eye1y = y + 6;
                        eye2x = x + CELL_SIZE - 6;
                        eye2y = y + 6;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1x, eye1y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(eye2x, eye2y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            if (!gameOver) {
                requestAnimationFrame(draw);
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('score-inline').textContent = score;
            document.getElementById('best').textContent = bestScore;
            document.getElementById('length').textContent = snake.length;

            // Bump animation
            const scoreEl = document.getElementById('score');
            scoreEl.classList.add('bump');
            setTimeout(() => scoreEl.classList.remove('bump'), 150);
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return;

            const keyMap = {
                'ArrowUp': { x: 0, y: -1 },
                'ArrowDown': { x: 0, y: 1 },
                'ArrowLeft': { x: -1, y: 0 },
                'ArrowRight': { x: 1, y: 0 },
                'w': { x: 0, y: -1 },
                's': { x: 0, y: 1 },
                'a': { x: -1, y: 0 },
                'd': { x: 1, y: 0 },
                'W': { x: 0, y: -1 },
                'S': { x: 0, y: 1 },
                'A': { x: -1, y: 0 },
                'D': { x: 1, y: 0 }
            };

            const newDir = keyMap[e.key];
            if (newDir) {
                e.preventDefault();

                // Prevent 180-degree turns
                if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
                    nextDirection = newDir;
                }
            }
        });

        // ============================================
        // CONTROLS
        // ============================================
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                speed = btn.dataset.speed;

                if (gameStarted && !gameOver) {
                    clearInterval(gameInterval);
                    gameInterval = setInterval(update, SPEEDS[speed]);
                }
            });
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            audio.init();
            document.getElementById('start-overlay').classList.add('hidden');
            gameStarted = true;
            initGame();
            draw();
            gameInterval = setInterval(update, SPEEDS[speed]);
        });

        document.getElementById('new-game').addEventListener('click', () => {
            if (gameStarted) {
                clearInterval(gameInterval);
                document.getElementById('game-over').classList.remove('visible');
                initGame();
                draw();
                gameInterval = setInterval(update, SPEEDS[speed]);
            }
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            clearInterval(gameInterval);
            document.getElementById('game-over').classList.remove('visible');
            initGame();
            draw();
            gameInterval = setInterval(update, SPEEDS[speed]);
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        initGame();
        draw();
        document.getElementById('best').textContent = bestScore;
    </script>
</body>
</html>
