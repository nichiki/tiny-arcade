<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Life - Tiny Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(10, 10, 15, 0.95) 0%, transparent 100%);
            pointer-events: none;
        }

        .header > * {
            pointer-events: auto;
        }

        .title-section {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .title {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .subtitle {
            font-size: 0.5rem;
            color: var(--text-tertiary);
            letter-spacing: 0.1em;
        }

        .stats {
            display: flex;
            gap: 1.5rem;
        }

        .stat-item {
            text-align: right;
        }

        .stat-label {
            font-size: 0.5rem;
            color: var(--text-tertiary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: rgba(18, 18, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 4px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .control-btn {
            font-family: inherit;
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .control-btn.active {
            background: var(--text-primary);
            color: var(--bg);
            border-color: var(--text-primary);
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1rem;
            background: rgba(18, 18, 26, 0.95);
            border: 1px solid var(--border);
            border-radius: 4px;
            backdrop-filter: blur(10px);
            z-index: 10;
            max-width: 200px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .panel-label {
            font-size: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* Attraction Matrix */
        .matrix-container {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .matrix-row {
            display: flex;
            gap: 0.25rem;
            align-items: center;
        }

        .matrix-label {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .matrix-cell {
            width: 24px;
            height: 24px;
            border-radius: 2px;
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
        }

        .matrix-cell:hover {
            transform: scale(1.1);
        }

        .matrix-cell::after {
            content: attr(data-value);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.4rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        /* Presets */
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .preset-btn {
            font-family: inherit;
            font-size: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 0.375rem 0.5rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-tertiary);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        /* Slider */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }

        .slider-label {
            font-size: 0.5rem;
            color: var(--text-tertiary);
            width: 45px;
            flex-shrink: 0;
        }

        .slider {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            flex-shrink: 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-secondary);
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-value {
            font-size: 0.5rem;
            color: var(--text-secondary);
            width: 28px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* Color legend */
        .color-legend {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .color-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .color-count {
            font-size: 0.5rem;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
        }

        /* Hint */
        .hint {
            position: fixed;
            bottom: 5.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.5rem;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .side-panel {
                right: 1rem;
                top: auto;
                bottom: 5rem;
                transform: none;
            }

            .header {
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="theme-dark">
    <nav class="nav-header">
        <a href="index.html" class="nav-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
        </a>
        <span class="nav-title">Particle Life</span>
    </nav>

    <canvas id="canvas"></canvas>

    <div class="header">
        <div class="title-section">
            <span class="title">Particle Life</span>
            <span class="subtitle">Artificial ecosystem</span>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Particles</div>
                <div class="stat-value" id="particle-count">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">FPS</div>
                <div class="stat-value" id="fps">60</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" id="play-btn">Pause</button>
        <button class="control-btn" id="reset-btn">Reset</button>
        <button class="control-btn" id="randomize-btn">Randomize</button>
    </div>

    <div class="side-panel">
        <div class="panel-section">
            <span class="panel-label">Attraction Matrix</span>
            <div class="matrix-container" id="matrix"></div>
            <span class="subtitle" style="margin-top: 0.25rem;">Click cells to change</span>
        </div>

        <div class="panel-section">
            <span class="panel-label">Presets</span>
            <div class="presets">
                <button class="preset-btn" data-preset="chaos">Chaos</button>
                <button class="preset-btn" data-preset="clusters">Clusters</button>
                <button class="preset-btn" data-preset="chains">Chains</button>
                <button class="preset-btn" data-preset="hunt">Hunt</button>
                <button class="preset-btn" data-preset="symbiosis">Symbiosis</button>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Parameters</span>
            <div class="slider-container">
                <div class="slider-row">
                    <span class="slider-label">Friction</span>
                    <input type="range" class="slider" id="friction" min="0" max="100" value="50">
                    <span class="slider-value" id="friction-value">0.5</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">Force</span>
                    <input type="range" class="slider" id="force" min="1" max="100" value="30">
                    <span class="slider-value" id="force-value">0.3</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">Range</span>
                    <input type="range" class="slider" id="range" min="20" max="200" value="80">
                    <span class="slider-value" id="range-value">80</span>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <span class="panel-label">Population</span>
            <div class="color-legend" id="legend"></div>
        </div>
    </div>

    <p class="hint">Particles attract or repel based on color relationships</p>

    <script src="js/audio.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const COLORS = [
            '#e07a5f', // Terracotta
            '#81b29a', // Sage
            '#f2cc8f', // Sandy
            '#3d405b', // Charcoal
            '#f4f1de'  // Cream
        ];

        const NUM_COLORS = COLORS.length;
        const PARTICLES_PER_COLOR = 100;

        // ============================================
        // STATE
        // ============================================
        let canvas, ctx;
        let particles = [];
        let attractionMatrix = [];
        let isRunning = true;
        let friction = 0.5;
        let forceFactor = 0.3;
        let maxDistance = 80;

        // FPS tracking
        let frameCount = 0;
        let lastFpsUpdate = performance.now();
        let currentFps = 60;

        // ============================================
        // PARTICLE CLASS
        // ============================================
        class Particle {
            constructor(x, y, colorIndex) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.colorIndex = colorIndex;
                this.color = COLORS[colorIndex];
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            resize();
            window.addEventListener('resize', resize);

            initAttractionMatrix();
            createParticles();
            renderMatrix();
            renderLegend();
            setupControls();

            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];

            for (let c = 0; c < NUM_COLORS; c++) {
                for (let i = 0; i < PARTICLES_PER_COLOR; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    particles.push(new Particle(x, y, c));
                }
            }

            document.getElementById('particle-count').textContent = particles.length;
        }

        function initAttractionMatrix() {
            attractionMatrix = [];
            for (let i = 0; i < NUM_COLORS; i++) {
                attractionMatrix[i] = [];
                for (let j = 0; j < NUM_COLORS; j++) {
                    attractionMatrix[i][j] = (Math.random() * 2 - 1);
                }
            }
        }

        // ============================================
        // PHYSICS
        // ============================================
        function update() {
            // Apply forces between particles
            for (let i = 0; i < particles.length; i++) {
                let fx = 0, fy = 0;
                const p1 = particles[i];

                for (let j = 0; j < particles.length; j++) {
                    if (i === j) continue;

                    const p2 = particles[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 0 && dist < maxDistance) {
                        const attraction = attractionMatrix[p1.colorIndex][p2.colorIndex];

                        // Force falloff
                        const force = attraction * forceFactor * (1 - dist / maxDistance);

                        fx += (dx / dist) * force;
                        fy += (dy / dist) * force;
                    }
                }

                p1.vx = (p1.vx + fx) * (1 - friction);
                p1.vy = (p1.vy + fy) * (1 - friction);
            }

            // Update positions
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;

                // Wrap around edges
                if (p.x < 0) p.x += canvas.width;
                if (p.x > canvas.width) p.x -= canvas.width;
                if (p.y < 0) p.y += canvas.height;
                if (p.y > canvas.height) p.y -= canvas.height;
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            // Fade effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw particles
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                // Subtle glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = p.color + '20';
                ctx.fill();
            }
        }

        function loop(timestamp) {
            // FPS calculation
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                currentFps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                document.getElementById('fps').textContent = currentFps;
            }

            if (isRunning) {
                update();
            }
            draw();

            requestAnimationFrame(loop);
        }

        // ============================================
        // MATRIX UI
        // ============================================
        function renderMatrix() {
            const container = document.getElementById('matrix');
            container.innerHTML = '';

            // Header row
            const headerRow = document.createElement('div');
            headerRow.className = 'matrix-row';
            headerRow.innerHTML = '<div style="width: 12px;"></div>';

            for (let j = 0; j < NUM_COLORS; j++) {
                const label = document.createElement('div');
                label.className = 'matrix-label';
                label.style.background = COLORS[j];
                label.style.width = '24px';
                label.style.height = '12px';
                label.style.borderRadius = '2px';
                headerRow.appendChild(label);
            }
            container.appendChild(headerRow);

            // Matrix rows
            for (let i = 0; i < NUM_COLORS; i++) {
                const row = document.createElement('div');
                row.className = 'matrix-row';

                // Row label
                const label = document.createElement('div');
                label.className = 'matrix-label';
                label.style.background = COLORS[i];
                row.appendChild(label);

                // Cells
                for (let j = 0; j < NUM_COLORS; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    cell.dataset.i = i;
                    cell.dataset.j = j;

                    updateCellColor(cell, attractionMatrix[i][j]);

                    cell.addEventListener('click', () => {
                        // Cycle through values: -1 -> 0 -> 1 -> -1
                        let val = attractionMatrix[i][j];
                        if (val < -0.3) val = 0;
                        else if (val < 0.3) val = 1;
                        else val = -1;
                        attractionMatrix[i][j] = val;
                        updateCellColor(cell, val);
                    });

                    row.appendChild(cell);
                }

                container.appendChild(row);
            }
        }

        function updateCellColor(cell, value) {
            const normalized = (value + 1) / 2; // 0 to 1
            const r = Math.round(255 * (1 - normalized));
            const g = Math.round(255 * normalized);
            cell.style.background = `rgb(${r}, ${g}, 100)`;
            cell.dataset.value = value.toFixed(1);
        }

        function renderLegend() {
            const container = document.getElementById('legend');
            container.innerHTML = '';

            const counts = new Array(NUM_COLORS).fill(0);
            particles.forEach(p => counts[p.colorIndex]++);

            COLORS.forEach((color, i) => {
                const item = document.createElement('div');
                item.className = 'color-item';

                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = color;

                const count = document.createElement('span');
                count.className = 'color-count';
                count.textContent = counts[i];

                item.appendChild(dot);
                item.appendChild(count);
                container.appendChild(item);
            });
        }

        // ============================================
        // PRESETS
        // ============================================
        const PRESETS = {
            chaos: () => {
                for (let i = 0; i < NUM_COLORS; i++) {
                    for (let j = 0; j < NUM_COLORS; j++) {
                        attractionMatrix[i][j] = Math.random() * 2 - 1;
                    }
                }
            },
            clusters: () => {
                for (let i = 0; i < NUM_COLORS; i++) {
                    for (let j = 0; j < NUM_COLORS; j++) {
                        attractionMatrix[i][j] = i === j ? 1 : -0.5;
                    }
                }
            },
            chains: () => {
                for (let i = 0; i < NUM_COLORS; i++) {
                    for (let j = 0; j < NUM_COLORS; j++) {
                        if (j === (i + 1) % NUM_COLORS) {
                            attractionMatrix[i][j] = 1;
                        } else if (i === j) {
                            attractionMatrix[i][j] = 0.5;
                        } else {
                            attractionMatrix[i][j] = -0.3;
                        }
                    }
                }
            },
            hunt: () => {
                for (let i = 0; i < NUM_COLORS; i++) {
                    for (let j = 0; j < NUM_COLORS; j++) {
                        if (j === (i + 1) % NUM_COLORS) {
                            attractionMatrix[i][j] = 1; // Chase next color
                        } else if (i === (j + 1) % NUM_COLORS) {
                            attractionMatrix[i][j] = -1; // Flee from previous
                        } else {
                            attractionMatrix[i][j] = 0;
                        }
                    }
                }
            },
            symbiosis: () => {
                for (let i = 0; i < NUM_COLORS; i++) {
                    for (let j = 0; j < NUM_COLORS; j++) {
                        if (i === j) {
                            attractionMatrix[i][j] = -0.5; // Repel same
                        } else {
                            attractionMatrix[i][j] = 0.8; // Attract different
                        }
                    }
                }
            }
        };

        // ============================================
        // CONTROLS
        // ============================================
        function setupControls() {
            // Play/Pause
            document.getElementById('play-btn').addEventListener('click', function() {
                isRunning = !isRunning;
                this.textContent = isRunning ? 'Pause' : 'Play';
            });

            // Reset
            document.getElementById('reset-btn').addEventListener('click', () => {
                createParticles();
            });

            // Randomize
            document.getElementById('randomize-btn').addEventListener('click', () => {
                initAttractionMatrix();
                renderMatrix();
            });

            // Presets
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const preset = btn.dataset.preset;
                    if (PRESETS[preset]) {
                        PRESETS[preset]();
                        renderMatrix();
                    }
                });
            });

            // Sliders
            document.getElementById('friction').addEventListener('input', function() {
                friction = this.value / 100;
                document.getElementById('friction-value').textContent = friction.toFixed(2);
            });

            document.getElementById('force').addEventListener('input', function() {
                forceFactor = this.value / 100;
                document.getElementById('force-value').textContent = forceFactor.toFixed(2);
            });

            document.getElementById('range').addEventListener('input', function() {
                maxDistance = parseInt(this.value);
                document.getElementById('range-value').textContent = maxDistance;
            });
        }

        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
