<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #8a8a8a;
            --text-tertiary: #c0c0c0;
            --border: #e8e6e3;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            display: flex;
            gap: 3rem;
            align-items: flex-start;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 0 0.25rem;
        }

        .title {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .score-inline {
            font-size: 0.875rem;
            font-weight: 400;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .board-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        #canvas {
            display: block;
            border-radius: 3px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-width: 120px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .panel-label {
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            font-family: inherit;
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .hint {
            font-size: 0.5rem;
            color: var(--text-tertiary);
            line-height: 1.6;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 1px;
            left: 1px;
            right: 1px;
            bottom: 1px;
            background: rgba(250, 249, 247, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .overlay-score {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .overlay-label {
            font-size: 0.625rem;
            color: var(--text-tertiary);
            margin-bottom: 2rem;
        }

        .overlay-btn {
            font-family: inherit;
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .overlay-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 2rem;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <div class="header">
                <span class="title">Flappy Bird</span>
                <span class="score-inline" id="scoreInline">0</span>
            </div>
            <div class="board-container">
                <canvas id="canvas" width="320" height="480"></canvas>

                <div class="overlay" id="startOverlay">
                    <p class="overlay-title">Flappy Bird</p>
                    <p class="overlay-label">Click or press Space to flap</p>
                    <button class="overlay-btn" id="startBtn">Start</button>
                </div>

                <div class="overlay hidden" id="gameOverOverlay">
                    <p class="overlay-title">Game Over</p>
                    <p class="overlay-score" id="finalScore">0</p>
                    <p class="overlay-label">Score</p>
                    <button class="overlay-btn" id="restartBtn">Retry</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-section">
                <span class="panel-label">Score</span>
                <span class="score-value" id="score">0</span>
            </div>

            <div class="panel-section">
                <span class="panel-label">Best</span>
                <span class="score-value" id="best">0</span>
            </div>

            <div class="panel-section">
                <button class="btn" id="newGameBtn">New Game</button>
            </div>

            <div class="panel-section">
                <span class="panel-label">Controls</span>
                <p class="hint">
                    Space / Click to flap<br>
                    Avoid the pipes
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const scoreInlineEl = document.getElementById('scoreInline');
        const bestEl = document.getElementById('best');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const newGameBtn = document.getElementById('newGameBtn');

        // Audio
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'score') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Softened but still colorful palette
        const colors = {
            sky: '#d4e5ed',
            skyBottom: '#e8f0f4',
            ground: '#c9b896',
            groundDark: '#b5a67e',
            groundGrass: '#9abf8a',
            bird: '#d4ad5c',
            birdLight: '#e4c07a',
            birdDark: '#bf9a48',
            birdEye: '#4a4540',
            birdBeak: '#cc7744',
            pipe: '#7eb88a',
            pipeLight: '#96cca0',
            pipeDark: '#5a9a68'
        };

        // Game state
        let gameState = 'start';
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('flappyBest') || '0');
        bestEl.textContent = bestScore;

        // Bird
        const bird = {
            x: 80,
            y: 240,
            width: 28,
            height: 22,
            velocity: 0,
            gravity: 0.35,
            jump: -6.5,
            rotation: 0
        };

        // Pipes
        const pipeWidth = 44;
        const pipeGap = 140;
        const pipeSpeed = 2;
        let pipes = [];

        // Ground
        const groundHeight = 60;
        let groundOffset = 0;

        // Clouds
        let clouds = [];
        for (let i = 0; i < 4; i++) {
            clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 150 + 30,
                size: Math.random() * 25 + 35,
                speed: Math.random() * 0.3 + 0.15
            });
        }

        // Countdown
        let countdown = 0;
        let countdownTimer = null;

        // Particles
        let particles = [];

        function createParticles(x, y, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function resetGame() {
            bird.y = 240;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            particles = [];
            score = 0;
            scoreEl.textContent = '0';
            scoreInlineEl.textContent = '0';
        }

        function startCountdown() {
            gameState = 'countdown';
            countdown = 3;

            function tick() {
                playSound('score');
                if (countdown > 0) {
                    countdownTimer = setTimeout(() => {
                        countdown--;
                        if (countdown > 0) {
                            tick();
                        } else {
                            gameState = 'playing';
                        }
                    }, 800);
                }
            }
            tick();
        }

        function flap() {
            if (gameState === 'playing') {
                bird.velocity = bird.jump;
                playSound('flap');
                createParticles(bird.x - 10, bird.y, 3);
            }
        }

        function spawnPipe() {
            const minY = 80;
            const maxY = canvas.height - groundHeight - pipeGap - minY;
            const topHeight = Math.random() * maxY + minY;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                scored: false
            });
        }

        function update() {
            // Update clouds always
            for (const cloud of clouds) {
                cloud.x -= cloud.speed;
                if (cloud.x + cloud.size < 0) {
                    cloud.x = canvas.width + cloud.size;
                    cloud.y = Math.random() * 150 + 30;
                }
            }

            if (gameState === 'countdown') {
                // Ground scrolls during countdown
                groundOffset = (groundOffset + pipeSpeed) % 24;
                return;
            }

            if (gameState !== 'playing') return;

            // Bird physics
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Bird rotation
            bird.rotation = Math.min(Math.max(bird.velocity * 3, -25), 70);

            // Ground collision
            const groundY = canvas.height - groundHeight;
            if (bird.y + bird.height / 2 > groundY) {
                bird.y = groundY - bird.height / 2;
                gameOver();
                return;
            }

            // Ceiling
            if (bird.y - bird.height / 2 < 0) {
                bird.y = bird.height / 2;
                bird.velocity = 0;
            }

            // Pipe spawning
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 180) {
                spawnPipe();
            }

            // Pipe movement and collision
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= pipeSpeed;

                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                    continue;
                }

                // Collision
                const birdLeft = bird.x - bird.width / 2 + 4;
                const birdRight = bird.x + bird.width / 2 - 4;
                const birdTop = bird.y - bird.height / 2 + 3;
                const birdBottom = bird.y + bird.height / 2 - 3;

                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipeWidth;

                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    if (birdTop < pipe.topHeight || birdBottom > pipe.topHeight + pipeGap) {
                        gameOver();
                        return;
                    }
                }

                // Score
                if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
                    pipe.scored = true;
                    score++;
                    scoreEl.textContent = score;
                    scoreInlineEl.textContent = score;
                    playSound('score');
                    createParticles(bird.x + 15, bird.y, 4);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Update ground
            groundOffset = (groundOffset + pipeSpeed) % 24;
        }

        function gameOver() {
            gameState = 'gameOver';
            playSound('hit');

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('flappyBest', bestScore.toString());
                bestEl.textContent = bestScore;
            }

            finalScoreEl.textContent = score;
            gameOverOverlay.classList.remove('hidden');
        }

        function draw() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height - groundHeight);
            skyGradient.addColorStop(0, colors.sky);
            skyGradient.addColorStop(1, colors.skyBottom);
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            for (const cloud of clouds) {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size * 0.5, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.35, cloud.y - cloud.size * 0.1, cloud.size * 0.4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.7, cloud.y, cloud.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pipes
            for (const pipe of pipes) {
                // Top pipe
                ctx.fillStyle = colors.pipe;
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);

                // Top pipe cap
                ctx.fillStyle = colors.pipeLight;
                ctx.fillRect(pipe.x - 3, pipe.topHeight - 24, pipeWidth + 6, 24);

                // Top pipe highlight
                ctx.fillStyle = colors.pipeDark;
                ctx.fillRect(pipe.x - 3, pipe.topHeight - 24, 3, 24);

                // Top pipe inner highlight
                ctx.fillStyle = colors.pipeLight;
                ctx.fillRect(pipe.x + 4, 0, 6, pipe.topHeight - 24);

                // Bottom pipe
                const bottomY = pipe.topHeight + pipeGap;
                ctx.fillStyle = colors.pipe;
                ctx.fillRect(pipe.x, bottomY, pipeWidth, canvas.height - bottomY - groundHeight);

                // Bottom pipe cap
                ctx.fillStyle = colors.pipeLight;
                ctx.fillRect(pipe.x - 3, bottomY, pipeWidth + 6, 24);

                // Bottom pipe highlight
                ctx.fillStyle = colors.pipeDark;
                ctx.fillRect(pipe.x - 3, bottomY, 3, 24);

                // Bottom pipe inner highlight
                ctx.fillStyle = colors.pipeLight;
                ctx.fillRect(pipe.x + 4, bottomY + 24, 6, canvas.height - bottomY - groundHeight - 24);
            }

            // Ground
            const groundY = canvas.height - groundHeight;
            ctx.fillStyle = colors.ground;
            ctx.fillRect(0, groundY, canvas.width, groundHeight);

            // Grass line
            ctx.fillStyle = colors.groundGrass;
            ctx.fillRect(0, groundY, canvas.width, 6);

            // Ground pattern
            ctx.fillStyle = colors.groundDark;
            for (let x = -groundOffset; x < canvas.width; x += 24) {
                ctx.fillRect(x, groundY + 12, 12, 4);
            }

            // Bird
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation * Math.PI / 180);

            // Body
            ctx.fillStyle = colors.bird;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body highlight
            ctx.fillStyle = colors.birdLight;
            ctx.beginPath();
            ctx.ellipse(-2, -3, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Wing
            ctx.fillStyle = colors.birdDark;
            ctx.beginPath();
            ctx.ellipse(-2, 2, 8, 5, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Eye white
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(6, -3, 5, 0, Math.PI * 2);
            ctx.fill();

            // Eye
            ctx.fillStyle = colors.birdEye;
            ctx.beginPath();
            ctx.arc(7, -3, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Beak
            ctx.fillStyle = colors.birdBeak;
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(18, 2);
            ctx.lineTo(10, 5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Particles
            ctx.fillStyle = colors.bird;
            for (const p of particles) {
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Countdown display
            if (gameState === 'countdown' && countdown > 0) {
                ctx.fillStyle = 'rgba(250, 249, 247, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);

                ctx.fillStyle = '#1a1a1a';
                ctx.font = '600 72px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(countdown.toString(), canvas.width / 2, (canvas.height - groundHeight) / 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        function handleInput(e) {
            e.preventDefault();
            initAudio();

            if (gameState === 'playing') {
                flap();
            }
        }

        canvas.addEventListener('click', handleInput);
        canvas.addEventListener('touchstart', handleInput);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                initAudio();
                if (gameState === 'playing') {
                    flap();
                }
            }
        });

        startBtn.addEventListener('click', () => {
            initAudio();
            startOverlay.classList.add('hidden');
            resetGame();
            startCountdown();
        });

        restartBtn.addEventListener('click', () => {
            gameOverOverlay.classList.add('hidden');
            resetGame();
            startCountdown();
        });

        newGameBtn.addEventListener('click', () => {
            initAudio();
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            resetGame();
            startCountdown();
        });

        // Start
        gameLoop();
    </script>
</body>
</html>
